apiVersion: v1
kind: ConfigMap
metadata:
  name: marketing-microservice-config
  namespace: statex-apps
  labels:
    app: marketing-microservice
    managed-by: k8s-migration
data:
  NODE_ENV: "production"
  SERVICE_NAME: "marketing-microservice"
  DOMAIN: "marketing.alfares.cz"
  PORT: "4600"
  # Add environment variables from .env that are non-sensitive (no secrets, API keys, passwords)
  # Examples:
  # DATABASE_POOL_SIZE: "10"
  # LOG_LEVEL: "info"
  AUTH_SERVICE_URL: "http://auth-microservice.statex-apps.svc.cluster.local:3370"
  AUTH_UNSUBSCRIBE_PATH: "/auth/marketing/preferences/unsubscribe"
  LOGGING_SERVICE_URL: "http://logging-microservice.statex-apps.svc.cluster.local:3367"
  NOTIFICATION_SERVICE_URL: "http://notifications-microservice.statex-apps.svc.cluster.local:3368"
  LEADS_SERVICE_URL: "http://leads-microservice.statex-apps.svc.cluster.local:4400"
  LEADS_UNSUBSCRIBE_PATH: "/leads/marketing/preferences/unsubscribe"
  TENANT_APP_REGISTRY_URL: "http://tenant-app-registry-microservice.statex-apps.svc.cluster.local:4602"
  TENANT_APP_REGISTRY_VALIDATE_PATH: "/registry/marketing/validate"
  TENANT_APP_REGISTRY_TIMEOUT_MS: "3000"
  PREFERENCE_WRITE_TIMEOUT_MS: "5000"
  CAMPAIGN_MAX_SEND_PER_RUN: "300"
  ORDERS_EVENTS_CONSUMER_ENABLED: "true"
  ORDERS_EVENTS_EXCHANGE: "orders.events"
  ORDERS_EVENTS_QUEUE: "marketing.orders.lifecycle"
  ORDERS_EVENTS_ROUTING_KEYS: "orders.order.created.v1,orders.order.updated.v1"
  ORDERS_EVENTS_DEAD_LETTER_EXCHANGE: "marketing.orders.lifecycle.dlx"
  ORDERS_EVENTS_PREFETCH: "10"
  ORDERS_EVENTS_REQUEUE_ON_ERROR: "false"
  ORDER_AFFINITY_CATALOG_PUBLISH_ENABLED: "true"
  CATALOG_SERVICE_URL: "http://catalog-microservice.statex-apps.svc.cluster.local:3200"
  CATALOG_ORDER_AFFINITY_BATCH_ENDPOINT: "/api/internal/product-relations/order-affinity/batch"
  CATALOG_ORDER_AFFINITY_TIMEOUT_MS: "5000"
  CATALOG_ORDER_AFFINITY_BATCH_SIZE: "50"
  DB_HOST: "db-server-postgres"
  DB_PORT: "5432"
  DB_USER: "dbadmin"
  DB_NAME: "marketing"
  DB_SYNC: "false"
  DB_AUTO_CREATE: "true"
  # TIMEOUT_MS: "30000"
