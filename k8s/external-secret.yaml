apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: marketing-microservice-secret
  namespace: statex-apps
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: marketing-microservice-secret
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: secret/prod/marketing-microservice
        property: DB_PASSWORD
    # TASK-KEY-F2: was the shared SERVICE_TOKEN value (global:superadmin, 6 holders).
    # Now this service's own delivery-scoped token. Env var name unchanged so no code change.
    - secretKey: NOTIFICATION_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/marketing-microservice
        property: NOTIFICATIONS_SERVICE_TOKEN
    # Guards the 17 mutating API routes behind requireServiceAuth (/campaigns,
    # /journeys, /segments, /scheduler/run-due). Its own opaque secret, NOT
    # JWT_TOKEN: that property held the shared a2880693 value. No ecosystem
    # service sends x-service-token here — this is an operator credential, so it
    # has no service principal behind it by design.
    - secretKey: MARKETING_API_TOKEN
      remoteRef:
        key: secret/prod/marketing-microservice
        property: MARKETING_API_TOKEN
    - secretKey: RABBITMQ_URL
      remoteRef:
        key: secret/prod/runlayer
        property: RABBITMQ_URL
    - secretKey: CATALOG_INTERNAL_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/auth-microservice
        property: CATALOG_INTERNAL_SERVICE_TOKEN
    # Per-pair RS256 principal for marketing-microservice -> orders-microservice
    # (svc-marketing-microservice--orders-microservice@internal.alfares.cz, 90d,
    # role internal:marketing-microservice:service). Previously mapped to this
    # service's JWT_TOKEN, which held a roleless docs-rag token that orders only
    # accepted because it string-matched MARKETING_INTERNAL_SERVICE_TOKEN.
    - secretKey: ORDERS_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/marketing-microservice
        property: ORDERS_SERVICE_TOKEN
    - secretKey: ORDER_AFFINITY_MARKETPLACE_REPLAY_TOKEN
      remoteRef:
        key: secret/prod/allegro-service
        property: JWT_TOKEN
    # Sender side of the marketing -> aukro replay lane. Points at aukro's own
    # MARKETING_REPLAY_TOKEN, the same property aukro mounts as
    # AUKRO_INTERNAL_SERVICE_TOKEN, so both ends move together on one write.
    - secretKey: ORDER_AFFINITY_AUKRO_REPLAY_TOKEN
      remoteRef:
        key: secret/prod/aukro-service
        property: MARKETING_REPLAY_TOKEN
    # Sender side of the marketing -> bazos replay lane. Points at bazos's own
    # MARKETING_REPLAY_TOKEN, the same property bazos mounts as
    # BAZOS_INTERNAL_SERVICE_TOKEN, so both ends move together on one write.
    - secretKey: ORDER_AFFINITY_BAZOS_REPLAY_TOKEN
      remoteRef:
        key: secret/prod/bazos-service
        property: MARKETING_REPLAY_TOKEN
    # Own property, matching the bazos entry above. This previously read
    # property: JWT_TOKEN, which flipflop also used for its own JWT_TOKEN key and for
    # FLIPFLOP_INTERNAL_SERVICE_SECRET -- one value doing three jobs across two repos,
    # so rotating any one of them silently changed the other two. flipflop split its
    # side on 2026-09-01 and seeded this property byte-identical, so this remap is a
    # no-op today and lets the replay credential rotate on its own from here.
    - secretKey: ORDER_AFFINITY_FLIPFLOP_REPLAY_TOKEN
      remoteRef:
        key: secret/prod/flipflop-service
        property: ORDER_AFFINITY_REPLAY_TOKEN

    # Must hold the same value as auth-microservice's copy, or every
    # unsubscribe link in every sent marketing message fails verification.
    - secretKey: MARKETING_UNSUBSCRIBE_SECRET
      remoteRef:
        key: secret/prod/marketing-microservice
        property: MARKETING_UNSUBSCRIBE_SECRET
