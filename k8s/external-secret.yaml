apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: marketing-microservice-secret
  namespace: statex-apps
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: marketing-microservice-secret
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: secret/prod/marketing-microservice
        property: DB_PASSWORD
    - secretKey: NOTIFICATION_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/marketing-microservice
        property: NOTIFICATION_SERVICE_TOKEN
    - secretKey: MARKETING_API_TOKEN
      remoteRef:
        key: secret/prod/marketing-microservice
        property: JWT_TOKEN
    - secretKey: JWT_TOKEN
      remoteRef:
        key: secret/prod/marketing-microservice
        property: JWT_TOKEN
    - secretKey: RABBITMQ_URL
      remoteRef:
        key: secret/prod/runlayer
        property: RABBITMQ_URL
    - secretKey: CATALOG_INTERNAL_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/auth-microservice
        property: CATALOG_INTERNAL_SERVICE_TOKEN
