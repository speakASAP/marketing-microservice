apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: marketing-microservice-secret
  namespace: statex-apps
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: marketing-microservice-secret
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: secret/prod/marketing-microservice
        property: DB_PASSWORD
    # TASK-KEY-F2: was the shared SERVICE_TOKEN value (global:superadmin, 6 holders).
    # Now this service's own delivery-scoped token. Env var name unchanged so no code change.
    - secretKey: NOTIFICATION_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/marketing-microservice
        property: NOTIFICATIONS_SERVICE_TOKEN
    - secretKey: MARKETING_API_TOKEN
      remoteRef:
        key: secret/prod/marketing-microservice
        property: JWT_TOKEN
    - secretKey: RABBITMQ_URL
      remoteRef:
        key: secret/prod/runlayer
        property: RABBITMQ_URL
    - secretKey: CATALOG_INTERNAL_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/auth-microservice
        property: CATALOG_INTERNAL_SERVICE_TOKEN
    # Per-pair RS256 principal for marketing-microservice -> orders-microservice
    # (svc-marketing-microservice--orders-microservice@internal.alfares.cz, 90d,
    # role internal:marketing-microservice:service). Previously mapped to this
    # service's JWT_TOKEN, which held a roleless docs-rag token that orders only
    # accepted because it string-matched MARKETING_INTERNAL_SERVICE_TOKEN.
    - secretKey: ORDERS_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/marketing-microservice
        property: ORDERS_SERVICE_TOKEN
    - secretKey: ORDER_AFFINITY_MARKETPLACE_REPLAY_TOKEN
      remoteRef:
        key: secret/prod/allegro-service
        property: JWT_TOKEN
    - secretKey: ORDER_AFFINITY_FLIPFLOP_REPLAY_TOKEN
      remoteRef:
        key: secret/prod/flipflop-service
        property: JWT_TOKEN

    # Must hold the same value as auth-microservice's copy, or every
    # unsubscribe link in every sent marketing message fails verification.
    - secretKey: MARKETING_UNSUBSCRIBE_SECRET
      remoteRef:
        key: secret/prod/marketing-microservice
        property: MARKETING_UNSUBSCRIBE_SECRET
