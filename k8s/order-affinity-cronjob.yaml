apiVersion: batch/v1
kind: CronJob
metadata:
  name: marketing-order-affinity-allegro-daily
  namespace: statex-apps
  labels:
    app: marketing-microservice
    managed-by: k8s-migration
    workload: order-affinity-backfill
spec:
  schedule: "23 2 * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 1800
  suspend: false
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app: marketing-microservice
            workload: order-affinity-backfill
        spec:
          restartPolicy: Never
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          containers:
            - name: order-affinity-allegro-daily
              image: localhost:5000/marketing-microservice:latest
              imagePullPolicy: Always
              command:
                - node
                - dist/order-affinity-backfill.js
              args:
                - --marketplace-url
                - http://allegro-service.statex-apps.svc.cluster.local:3000
                - --limit
                - "200"
                - --publish
                - --record-ledger
                - --schedule
                - daily
                - --window-delay-minutes
                - "120"
                - --source-owner
                - allegro-service
                - --channel
                - allegro
                - --created-by
                - marketing-order-affinity-cron
              envFrom:
                - configMapRef:
                    name: marketing-microservice-config
                - secretRef:
                    name: marketing-microservice-secret
              env:
                - name: HOME
                  value: /home/ssf
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "50m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: marketing-order-affinity-aukro-daily
  namespace: statex-apps
  labels:
    app: marketing-microservice
    managed-by: k8s-migration
    workload: order-affinity-backfill
    activation-state: draft-suspended
  annotations:
    marketing.statex/activation-state: "draft-suspended"
    marketing.statex/activation-blocker-non-empty-evidence: "required"
    marketing.statex/activation-blocker-owner-source-window-approval: "required"
spec:
  schedule: "23 4 * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 1800
  suspend: true
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app: marketing-microservice
            workload: order-affinity-backfill
            source-owner: aukro-service
        spec:
          restartPolicy: Never
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          containers:
            - name: order-affinity-aukro-daily
              image: localhost:5000/marketing-microservice:latest
              imagePullPolicy: Always
              command:
                - node
                - dist/order-affinity-backfill.js
              args:
                - --marketplace-url
                - http://aukro-service.statex-apps.svc.cluster.local:3700
                - --limit
                - "200"
                - --publish
                - --record-ledger
                - --schedule
                - daily
                - --window-delay-minutes
                - "120"
                - --source-owner
                - aukro-service
                - --channel
                - aukro
                - --created-by
                - marketing-order-affinity-cron
              envFrom:
                - configMapRef:
                    name: marketing-microservice-config
                - secretRef:
                    name: marketing-microservice-secret
              env:
                - name: HOME
                  value: /home/ssf
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "50m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"
