services:
  marketing-microservice-green:
    image: node:22-alpine
    container_name: marketing-microservice-green
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    env_file:
      - .env
    environment:
      - SERVICE_NAME=marketing-microservice
      - PORT=${GREEN_PORT:-4601}
    volumes:
      - ./:/app
    ports:
      - "${GREEN_PORT:-4601}:${GREEN_PORT:-4601}"
    networks:
      - nginx-network

networks:
  nginx-network:
    external: true
