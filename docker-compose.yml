services:
  marketing-microservice:
    image: node:22-alpine
    container_name: marketing-microservice
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    env_file:
      - .env
    environment:
      - SERVICE_NAME=${SERVICE_NAME:-marketing-microservice}
      - PORT=${PORT:-4600}
    volumes:
      - ./:/app
    ports:
      - "${PORT:-4600}:${PORT:-4600}"
    networks:
      - nginx-network

networks:
  nginx-network:
    external: true
